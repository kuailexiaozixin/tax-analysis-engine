<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>规则的起点 — 税务问题分析与依据核查</title>

     用 data: 占位比加路由省事：不动路由数量，也不用多带一个图标文件。 -->

<style>
:root {
  --black: #111;
  --white: #fff;
  --g50: #fafafa;
  --g100: #f5f5f5;
  --g200: #e5e5e5;
  --g300: #d4d4d4;
  --g400: #a3a3a3;
  --g500: #737373;
  --g600: #525252;
  --g700: #404040;
  --g800: #262626;
  --g900: #171717;
  --accent: #dc2626;
  --panel-w: 420px;
  --readable: 720px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--white);color:var(--black);line-height:1.7;
  -webkit-font-smoothing:antialiased;
}

/* ── Hero ── */
.hero{
  padding:100px 20px 40px;
  text-align:center;
  transition:padding .5s ease;
  max-width:var(--readable);
  margin:0 auto;
}
.hero.compact{padding:36px 20px 16px}
.hero-inner{max-width:560px;margin:0 auto}

.hero-logo{color:var(--black);margin-bottom:20px;display:inline-block}
.hero-logo svg{display:block}
.hero.compact .hero-logo svg{width:28px;height:28px}
.hero.compact .hero-logo{margin-bottom:10px}

.hero-title{
  font-size:clamp(28px,4.5vw,50px);
  font-weight:700;
  letter-spacing:8px;
  color:var(--black);
  margin-bottom:28px;
  transition:font-size .5s ease,margin .5s ease,letter-spacing .5s ease;
}
.hero.compact .hero-title{
  font-size:20px;
  letter-spacing:4px;
  margin-bottom:14px;
}

/* ── Search Box (red accent) ── */
.search-box{
  display:flex;
  max-width:520px;
  margin:0 auto;
  border:2px solid var(--accent);
  transition:box-shadow .2s;
}
.search-box:focus-within{
  box-shadow:0 0 0 3px rgba(220,38,38,.12);
}
.search-input{
  flex:1;min-width:0;
  padding:13px 16px;
  border:none;
  font-size:15px;
  outline:none;
  background:var(--white);
  color:var(--black);
}
.search-input::placeholder{color:var(--g400)}
.search-btn{
  padding:13px 24px;
  background:var(--accent);
  color:#fff;
  border:none;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  letter-spacing:2px;
  transition:opacity .15s;
  white-space:nowrap;
}
.search-btn:hover{opacity:.88}
.search-btn:disabled{opacity:.35;cursor:not-allowed}

/* ── Subtitle ── */
.hero-subtitle{
  font-size:13px;
  color:var(--g400);
  margin-top:18px;
  letter-spacing:1px;
  transition:opacity .4s;
}
.hero.compact .hero-subtitle{display:none}

/* ── Quick Tax (text links) ── */
.quick-tax{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
  margin-top:18px;
  transition:opacity .3s;
}
.hero.compact .quick-tax{margin-top:10px}
.quick-tax button{
  padding:8px 4px;
  border:1px solid var(--g200);
  background:var(--white);
  font-size:13px;
  font-weight:600;
  color:var(--g600);
  cursor:pointer;
  border-radius:6px;
  transition:all .12s;
  text-align:center;
}
.quick-tax button:hover{
  border-color:var(--black);
  color:var(--black);
  background:var(--g50);
}

/* ── Toggle links ── */
.toggle-row{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:14px;
  font-size:12.5px;
}
.toggle-row span{
  color:var(--g400);
  cursor:pointer;
  transition:color .12s;
  letter-spacing:.5px;
  user-select:none;
}
.toggle-row span:hover{color:var(--black)}

/* ── Filters bar ── */
.filters-bar{
  max-width:var(--readable);
  margin:0 auto;
  padding:12px 16px 16px;
  display:none;
  flex-wrap:wrap;
  gap:8px 14px;
  align-items:center;
  border-bottom:1px solid var(--g100);
}
.filters-bar.open{display:flex}
.filter-group{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:12px;
  color:var(--g500);
}
.filter-group select,.filter-group input{
  padding:4px 8px;
  border:1px solid var(--g200);
  border-radius:2px;
  font-size:12px;
  outline:none;
  background:var(--white);
  color:var(--black);
  font-family:inherit;
}
.filter-group select:focus,.filter-group input:focus{
  border-color:var(--black);
}

/* ── Results ── */
.results-area{padding:0 20px 60px;max-width:var(--readable);margin:0 auto}
.meta-bar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 0;
  font-size:12px;
  color:var(--g500);
  flex-wrap:wrap;
  border-bottom:1px solid var(--g100);
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:2px 8px;
  border:1px solid var(--g200);
  border-radius:2px;
  font-size:11px;
  color:var(--g600);
}
.tag-intent{border-color:var(--g300);color:var(--g700)}
.tag-source{border-color:var(--g300);color:var(--g700)}
.tag-time{border-color:var(--g200);color:var(--g500)}
.tag-count{border-color:var(--g200);color:var(--g700);font-weight:600}

.source-label{
  display:inline-flex;align-items:center;gap:2px;
  padding:1px 6px;border:1px solid var(--g200);
  border-radius:2px;font-size:10.5px;
}
.src-npc{border-color:var(--g300)}
.src-chinatax{border-color:var(--g300)}
.src-anysearch{border-color:var(--g300)}

.result-card{
  padding:16px 0;
  border-bottom:1px solid var(--g100);
  cursor:pointer;
  transition:background .12s;
}
.result-card:hover{background:var(--g50);margin:0 -12px;padding:16px 12px;border-bottom-color:var(--g200)}
.result-card .title{font-size:15px;font-weight:600;margin-bottom:5px;line-height:1.5}
.result-card .meta{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  font-size:12px;
  color:var(--g500);
}
.result-card .meta span{display:inline-flex;align-items:center;gap:3px}
.result-card .id-row{font-size:10.5px;color:var(--g400);font-family:monospace;margin-top:3px}
.result-card .rel-note{font-size:11px;color:#8a6d1f;margin-top:4px}

.status-badge{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 7px;border:1px solid var(--g200);
  border-radius:2px;font-size:11px;font-weight:500;
}
.s-effective{border-color:var(--g300);color:var(--g700)}
.s-amended{border-color:var(--g300);color:var(--g600)}
.s-abolished{border-color:var(--g300);color:var(--g500)}
.s-pending{border-color:var(--g300);color:var(--g600)}
.s-unknown{border-color:var(--g400);color:var(--g700);font-weight:600}

.empty-state,.loading-state{text-align:center;padding:60px 20px;color:var(--g500)}
.empty-state p{color:var(--g400)}
.loading-spinner{
  width:28px;height:28px;
  border:2px solid var(--g200);
  border-top-color:var(--black);
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Modal ── */
.modal-overlay{
  position:fixed;inset:0;
  background:#00000060;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  animation:fadeIn .2s;
}
@keyframes fadeIn{from{opacity:0}}
.modal{
  background:var(--white);
  border:1px solid var(--g200);
  width:100%;
  max-width:820px;
  max-height:88vh;
  display:flex;
  flex-direction:column;
  box-shadow:0 8px 40px rgba(0,0,0,.08);
}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;border-bottom:1px solid var(--g200);flex-shrink:0;
}
.modal-header h2{font-size:15px;margin:0;flex:1;padding-right:12px;font-weight:600}
.modal-header .close-btn{
  width:32px;height:32px;border:none;background:none;
  font-size:20px;cursor:pointer;border-radius:2px;color:var(--g500);
}
.modal-header .close-btn:hover{background:var(--g50)}
.modal-body{flex:1;overflow-y:auto;padding:0;font-size:14px;line-height:1.9;min-height:300px;position:relative}
.modal-body .tab-panel{display:none;min-height:300px}
.modal-body .tab-panel.active{display:block}
.modal-body .body-padded{padding:16px 24px}
.modal-footer{
  display:flex;gap:8px;padding:10px 20px;
  border-top:1px solid var(--g200);flex-shrink:0;justify-content:flex-end;
}
.modal-footer button{
  padding:6px 16px;border:1px solid var(--g200);
  border-radius:2px;font-size:12.5px;cursor:pointer;background:var(--white);
}
.modal-footer button:hover{background:var(--g50)}
.modal-footer button.primary{
  background:var(--black);color:#fff;border-color:var(--black);
}
.modal-footer button.primary:hover{background:var(--g800)}

/* ── Modal Tabs ── */
.modal-tabs{
  display:flex;border-bottom:1px solid var(--g200);
  flex-shrink:0;padding:0 20px;background:var(--g50);
}
.modal-tabs .tab-btn{
  padding:9px 16px;border:none;background:none;
  font-size:13px;font-weight:500;color:var(--g500);
  cursor:pointer;border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:all .15s;
}
.modal-tabs .tab-btn:hover{color:var(--black)}
.modal-tabs .tab-btn.active{color:var(--black);border-bottom-color:var(--black);font-weight:600}

/* ── Tab: Law Text ── */
.modal-body mark{background:#f5f5f5;color:var(--black);padding:0 2px;border-radius:1px;font-weight:600}
.modal-body .chapter{font-weight:700;font-size:14px;margin:18px 0 8px;color:var(--black);padding-bottom:3px;border-bottom:1px solid var(--g100)}
.modal-body .chapter:first-child{margin-top:0}
.modal-body .article{font-weight:600;margin:12px 0 3px;color:var(--g800)}
.modal-body .body-text{margin:2px 0;color:var(--g700);text-indent:2em}
.modal-body .meta-note{
  background:var(--g50);padding:10px 16px;margin-bottom:14px;
  font-size:12px;color:var(--g500);display:flex;gap:14px;flex-wrap:wrap;
}

/* ── Tab: Interpretations ── */
.interp-card{
  display:block;padding:14px 18px;
  border-bottom:1px solid var(--g100);
  text-decoration:none;color:var(--black);transition:background .12s;
}
.interp-card:hover{background:var(--g50)}
.interp-card .it{font-size:13.5px;font-weight:600;margin-bottom:3px}
.interp-card .im{font-size:12px;color:var(--g500);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.interp-card .is{
  display:inline-flex;align-items:center;gap:2px;
  padding:1px 6px;border:1px solid var(--g200);
  border-radius:2px;font-size:10.5px;
}
.is-official{border-color:var(--g300);color:var(--g700)}
.is-practical{border-color:var(--g300);color:var(--g700)}
.is-web{border-color:var(--g200);color:var(--g500)}
.interp-empty{text-align:center;padding:40px 20px;color:var(--g500)}
/* 地方口径只对"官方解读"这一个标签页生效，所以控件长在这个页里，不放搜索栏 */
.interp-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:14px 24px;border-bottom:1px solid var(--g100);font-size:12px;color:var(--g500)}
.interp-toolbar select{padding:4px 8px;border:1px solid var(--g200);border-radius:2px;font-size:12px;outline:none;background:var(--white);color:var(--black);font-family:inherit}
.interp-toolbar select:focus{border-color:var(--black)}
.interp-toolbar .it-hint{color:var(--g400);font-size:11px;line-height:1.5}

/* ── Guidance Panel ── */
.guidance-panel{
  position:fixed;top:0;right:0;bottom:0;
  width:var(--panel-w);
  background:var(--white);
  border-left:1px solid var(--g200);
  z-index:500;
  display:flex;
  flex-direction:column;
  transform:translateX(100%);
  transition:transform .25s;
}
.guidance-panel.open{transform:translateX(0)}
.guidance-panel .gp-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--g200);flex-shrink:0;
}
.guidance-panel .gp-header h3{font-size:15px;font-weight:600}
.guidance-panel .gp-body{flex:1;overflow-y:auto;padding:18px}
.guidance-panel .gp-body .step{margin-bottom:18px}
.guidance-panel .gp-body .step-label{
  font-size:10.5px;color:var(--g400);
  text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;
}
.guidance-panel .gp-body .step-question{font-size:14px;font-weight:600;margin-bottom:10px}
.guidance-panel .gp-body .choice-grid{display:flex;flex-wrap:wrap;gap:5px}
.guidance-panel .gp-body .choice{
  flex:1 1 calc(50% - 5px);min-width:90px;
  padding:12px 8px;
  border:1px solid var(--g200);
  border-radius:2px;
  text-align:center;cursor:pointer;font-size:13px;
  transition:all .12s;background:var(--white);color:var(--g600);
}
.guidance-panel .gp-body .choice:hover{border-color:var(--black);color:var(--black)}
.guidance-panel .gp-body .choice.picked{border-color:var(--black);background:var(--g50);color:var(--black);font-weight:600}
.guidance-panel .gp-body .choice .ci{font-size:18px;display:block;margin-bottom:2px}
.guidance-panel .gp-body .choice .cl{display:block;font-size:11px;color:var(--g400);margin-top:2px}
.guidance-panel .gp-footer{padding:12px 18px;border-top:1px solid var(--g200);flex-shrink:0}
.guidance-panel .gp-footer button{
  width:100%;padding:9px;
  background:var(--black);color:#fff;
  border:none;font-size:14px;font-weight:600;cursor:pointer;
}
.guidance-panel .gp-footer button:disabled{opacity:.3;cursor:not-allowed}
.guidance-panel .gp-footer button:hover:not(:disabled){background:var(--g800)}
.guidance-panel .gp-footer .reset{
  background:none;color:var(--g500);font-size:12px;margin-top:4px;width:100%;
}
.guidance-panel .gp-footer .reset:hover{color:var(--black);background:none}

/* ── Footer ── */
.page-footer{
  text-align:center;
  padding:28px 20px 20px;
  font-size:11px;
  color:var(--g400);
  letter-spacing:.3px;
  border-top:1px solid var(--g50);
  margin-top:20px;
}
.page-footer a{color:var(--g500);text-decoration:none}
.page-footer a:hover{color:var(--black)}

/* ── Responsive ── */
@media(max-width:800px){
  .hero{padding:60px 16px 28px}
  .hero.compact{padding:24px 16px 12px}
  .hero-title{font-size:clamp(24px,6vw,36px);letter-spacing:4px}
  .search-box{max-width:100%}
  .search-input{padding:11px 14px;font-size:14px}
  .search-btn{padding:11px 18px;font-size:13px}
  .quick-tax{grid-template-columns:repeat(3,1fr);gap:4px}
  .quick-tax button{padding:6px 4px;font-size:12px}
  .filters-bar{gap:6px 10px;padding:10px 12px}
  .guidance-panel{width:100%}
  .results-area{padding:0 12px 40px}
  .modal{max-width:100%;max-height:95vh;margin:8px;border:none}
  .modal-body .body-padded{padding:12px 16px}
  .interp-toolbar{padding:12px 16px}
  .modal-tabs{overflow-x:auto;padding:0 12px}
  .modal-tabs .tab-btn{padding:8px 12px;font-size:12px}
  .toggle-row{flex-direction:column;gap:6px;align-items:center}
}
</style>
</head>
<body>

<!-- ═══ HERO ═══ -->
<div class="hero" id="heroSection">
  <div class="hero-inner">
    <div class="hero-logo">
      <svg viewBox="0 0 40 40" width="36" height="36" fill="none">
        <rect x="4" y="4" width="32" height="32" rx="3" stroke="currentColor" stroke-width="1.5"/>
        <line x1="10" y1="14" x2="30" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="10" y1="20" x2="30" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="10" y1="26" x2="22" y2="26" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>

    <h1 class="hero-title">规则的起点</h1>

    <div class="search-box">
      <input type="text" class="search-input" id="searchInput"
        placeholder="搜索税收政策关键词…" autofocus>
      <button class="search-btn" id="searchBtn" onclick="doSearch()">搜索</button>
    </div>

    <p class="hero-subtitle">数据源自国家法规库 · 实时同步 · 现行有效</p>

    <div class="quick-tax" id="quickTax"></div>

    <div class="toggle-row">
      <span onclick="toggleFilters()">高级筛选 ▾</span>
      <span onclick="toggleGuidance()">智能引导</span>
    </div>
  </div>
</div>

<!-- ═══ FILTERS ═══ -->
<div class="filters-bar" id="filtersBar">
  <div class="filter-group"><label>范围</label><select id="filterScope"><option value="title" selected>标题</option><option value="fulltext">全文（按全文分词命中，可能偏题）</option></select></div>
  <div class="filter-group"><label>匹配</label><select id="filterType"><option value="fuzzy">模糊</option><option value="exact">精确</option></select></div>
  <div class="filter-group"><label>时效</label><select id="filterStatus" title=""><option value="3" selected>现行有效</option><option value="">全部</option></select></div>
  <div class="filter-group"><label>排序</label><select id="filterSort"><option value="relevance">相关度</option><option value="date">日期↓</option></select></div>
  <div class="filter-group"><label>数据源</label><select id="filterSource" onchange="syncFilterControls()"><option value="npc">NPC法规库</option><option value="aggregated">多源聚合</option><option value="chinatax">税务总局</option><option value="fgk">税务法规库</option></select></div>
  <div class="filter-group"><label title="这一栏的语义按数据源不同：NPC 法规库按公布日期收窄，税务总局与法规库按成文日期收窄，360 搜索／税屋／微信公众号没有日期参数、只在取回的条目窗口内补筛（各源计数与判读规则见结果上方那句说明）">日期</label><input type="date" id="filterDateFrom">—<input type="date" id="filterDateTo"></div>
</div>

<!-- ═══ RESULTS ═══ -->
<div class="results-area">
  <div id="resultsContainer"></div>
</div>

<!-- ═══ FOOTER ═══ -->
<div class="page-footer">
  数据源：<a href="https://flk.npc.gov.cn" target="_blank" rel="noopener">国家法律法规数据库</a> ·
  <a href="https://www.chinatax.gov.cn" target="_blank" rel="noopener">国家税务总局</a> ·
  财税实务公众号<br>
  搜索结果仅供参考，以官方发布为准
</div>

<!-- ═══ GUIDANCE PANEL ═══ -->
<div class="guidance-panel" id="guidancePanel">
  <div class="gp-header">
    <h3>智能引导</h3>
    <button style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--g500)" onclick="toggleGuidance()">✕</button>
  </div>
  <div class="gp-body" id="guideBody"></div>
  <div class="gp-footer" id="guideFooter"></div>
</div>

<!-- ═══ MODAL ═══ -->
<div id="modalOverlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()"></div>

<script>
/* ═══════════ STATE ═══════════ */
let lastResults=[],lastKeyword='',guideState={},activeTab='law';
const NEXT_STEP={user_type:'tax_type',tax_type:'intent',intent:'conditions'};

document.addEventListener('DOMContentLoaded',()=>{
  loadQuickTax();renderGuideStep('user_type');syncFilterControls();
  document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
});

/* ═══════════ GARBAGE FILTER ═══════════ */
const _GARBAGE_TITLES=['游戏','小游戏','攻略','视频','电影','电视剧','综艺','下载','app下载','安装','破解','会员','充值','美女','八卦','娱乐','体育','足球','NBA','4399','7k7k'];
function _isGarbage(title){for(const k of _GARBAGE_TITLES){if((title||'').includes(k))return true;}return false;}

/* ═══════════ TOGGLES ═══════════ */
function toggleFilters(){
  const bar=document.getElementById('filtersBar');
  bar.classList.toggle('open');
}

/* 「时效」这一控件在两条链路上量的是同一根轴（这份文件现在还作不作数），但值域
   不通用：NPC 库用数字码（3=现行有效），search5（税务总局／法规库）用文本
   （全文有效 等五项，取值域见 tax_web_search.AGING_VALUES）。search5 那两源不收
   xxgkAging 时才该把它置灰；后端 build_filters 收这一维之后置灰的理由不成立，
   所以整栏换成 search5 的值域。
   换值域时的默认值不同是实测决定的：NPC 那侧默认「现行有效」，而 search5 侧
   增值税×文件类标签 1908 条里只有 743 条录了时效，默认收窄会把 1165 条没录
   时效的现行文件一起筛掉，所以那两源默认退回「全部」。 */
const AGING_S5=['全文有效','已修改','全文失效','全文废止','尚未生效'];
const AGING_FROM_NPC={'3':'全文有效','2':'已修改','1':'全文废止','4':'尚未生效'};
function statusSpaceIsS5(){
  const s=document.getElementById('filterSource').value;
  return s==='chinatax'||s==='fgk';
}
function syncFilterControls(){
  const st=document.getElementById('filterStatus');
  const s5=statusSpaceIsS5();
  const want=st.value;                       // 换栏前用户选中的值
  const opts=s5?[['','全部'],...AGING_S5.map(v=>[v,v])]:[['3','现行有效'],['','全部']];
  st.innerHTML=opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('');
  // 换数据源后旧值多半不在新值域里，退回该源的默认而不是留个空白选项
  st.value=([...st.options].some(o=>o.value===want)?want:(s5?'':'3'));
  st.title=s5?'按法规库录入的时效收窄；默认「全部」，因为多数条目该栏为空'
             :'按 NPC 库的时效码收窄，默认「现行有效」';
}
/* 按 NPC 的时效码设置那一栏，落到哪个值域看当前数据源。向导（step 4「只看现行有效」）
   与主搜索栏共用这一个入口，免得当源是 search5 时把「3」写进一个不含该选项的
   select——那样选择会被静默吞成空值，用户以为收窄了其实没有。 */
function setNpcStatus(code){
  const st=document.getElementById('filterStatus');
  st.value=statusSpaceIsS5()?(AGING_FROM_NPC[code]||''):code;
}

/* ═══════════ SEARCH ═══════════ */
async function fetchWithRetry(url,opts={},retries=3,delay=800){
  for(let i=0;i<retries;i++){
    try{
      const r=await fetch(url,opts);
      const text=await r.text();
      if(!text||text.trim()===''){
        if(i<retries-1){await new Promise(x=>setTimeout(x,delay*(i+1)));continue;}
        throw new Error('服务返回空响应，请刷新重试');
      }
      try{return JSON.parse(text);}catch(e){
        if(i<retries-1){await new Promise(x=>setTimeout(x,delay*(i+1)));continue;}
        throw new Error('响应格式异常: '+text.slice(0,80));
      }
    }catch(e){
      if(e.name==='TypeError'||e.message.includes('Failed to fetch')||e.message.includes('NetworkError')){
        if(i<retries-1){
          const c=document.getElementById('resultsContainer');
          c.innerHTML=`<div class="loading-state"><div class="loading-spinner"></div><p>连接不稳定，正在重试…</p><p style="font-size:12px;color:var(--g400)">第 ${i+2}/${retries} 次尝试</p></div>`;
          await new Promise(x=>setTimeout(x,delay*(i+1)));
          continue;
        }
        throw new Error('网络连接失败，请检查网络后刷新页面重试');
      }
      throw e;
    }
  }
  throw new Error('请求失败，已达最大重试次数');
}

async function doSearch(){
  const keyword=document.getElementById('searchInput').value.trim();if(!keyword)return;
  const c=document.getElementById('resultsContainer'),btn=document.getElementById('searchBtn');
  c.innerHTML=`<div class="loading-state"><div class="loading-spinner"></div><p>正在查询…</p><p style="font-size:12px;color:var(--g400)">"${esc(keyword)}"</p></div>`;
  btn.disabled=true;btn.textContent='查询中…';
  try{
    // 这里刻意没有 province：本接口查的是全国性法规库，没有省级维度，
    // 服务端收到 province 也只是原样回填、不过滤。地方口径走弹窗里的"官方解读"（换站点检索）。
    // 时效那一栏按当前数据源的值域发：NPC／聚合发数字 status，search5 发文本 aging，
    // 另一栏留空——服务端各读各的，不会把「3」当时效文本发下去。
    const s5=statusSpaceIsS5(), stv=document.getElementById('filterStatus').value;
    const payload={
      keyword,scope:document.getElementById('filterScope').value,
      exact:document.getElementById('filterType').value==='exact',
      status:s5?null:(parseInt(stv)||null),
      aging:s5?stv:'',
      sort:document.getElementById('filterSort').value,
      source:document.getElementById('filterSource').value,
      date_from:document.getElementById('filterDateFrom').value||null,
      date_to:document.getElementById('filterDateTo').value||null,
    };
    const data=await fetchWithRetry('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    lastResults=(data.result?.results||data.result?.items||[]).filter(function(r){return !_isGarbage(r.title);});lastKeyword=keyword;
    renderResults(data);
    document.getElementById('heroSection').classList.add('compact');
  }catch(e){c.innerHTML=`<div class="empty-state"><div class="icon" style="font-size:28px;margin-bottom:8px">—</div><p><b>查询失败</b></p><p style="font-size:13px;color:var(--g400)">${esc(e.message)}</p><p style="font-size:12px;margin-top:8px;color:var(--g400)">已自动重试 3 次 · 请稍后再试</p></div>`}
  finally{btn.disabled=false;btn.textContent='搜索';}
}

function renderResults(data){
  const c=document.getElementById('resultsContainer'),result=data.result,items=result?.results||result?.items||[];
  const total=result?.total||result?.total_items||items.length,searchedAt=result?.searched_at||'';
  const cacheTag=result?._from_cache?' [缓存]':'';
  const srcLabels={npc:'NPC国家法规库',chinatax:'国家税务总局',so360:'360站内搜索',shui5:'税屋(实务解读)',wechat:'微信公众号(实务解读)'};
  const srcIcons={npc:'📜',chinatax:'🏛️',so360:'🔎',shui5:'🏠',wechat:'💬'};
  const statusMap={1:'s-abolished',2:'s-amended',3:'s-effective',4:'s-pending'};
  const statusIcons={1:'🔴',2:'🟡',3:'🟢',4:'🔵'};
  const statusNames={1:'已废止',2:'已修改',3:'现行有效',4:'尚未生效'};

  let h='';
  if(items.length>0||total>0){
    h+='<div class="meta-bar">';
    if(data.intent_label)h+=`<span class="tag tag-intent">🎯 ${data.intent_label}</span>`;
    if(data.tax_type)h+=`<span class="tag tag-source">📂 ${data.tax_type}</span>`;
    h+=`<span class="tag tag-count">📋 ${total}条</span>`;
    if(searchedAt)h+=`<span class="tag tag-time">🕐 ${searchedAt}${cacheTag}</span>`;
    h+='</div>';
  }
  if(result?.source_summary){const s=result.source_summary;h+='<div class="meta-bar">';if(s.npc)h+=`<span class="source-label src-npc">📜 NPC ${s.npc}条</span>`;if(s.chinatax)h+=`<span class="source-label src-chinatax">🏛️ 总局 ${s.chinatax}条</span>`;if(s.so360)h+=`<span class="source-label src-anysearch">🔎 360 ${s.so360}条</span>`;if(s.shui5)h+=`<span class="source-label src-anysearch">🏠 税屋 ${s.shui5}条</span>`;if(s.wechat)h+=`<span class="source-label src-anysearch">💬 公众号 ${s.wechat}条</span>`;h+='</div>';}
  // 缺了哪一层由后端给成句照抄（见 tax_aggregator._degraded_note）。这里不自己
  // 判断、也不把缺失渲染成普通的"0 条"——0 条看起来像"该层确实没有内容"。
  if(result?.degraded_note){h+=`<div class="meta-bar" style="border-bottom:none"><span class="source-label" style="border-color:var(--accent);color:var(--accent);white-space:normal">⚠️ ${esc(result.degraded_note)}</span></div>`;}
  // 检索词被换成什么、有没有换成，由后端给整句（tax_server 的 _routed）。
  // 归不出税种时这句是"这批结果是按原话字面匹配出来的"——不写出来，
  // 一摞无关法条看起来就像按本题找到的依据。
  if(result?._routed){h+=`<div class="meta-bar" style="border-bottom:none"><span class="source-label" style="border-color:var(--g700);color:var(--g700);white-space:normal">🧭 ${esc(result._routed)}</span></div>`;}
  // 日期区间这一维在五源里的生效方式不是一种（NPC/总局由接口收窄，360、税屋、
  // 公众号只能在取回的窗口内补筛），整句由后端给（tax_search._date_note 与
  // tax_aggregator._date_scope_note）。这里照抄：前端不自己判断哪一源真收窄过，
  // 也不把"窗口内补筛到 0 条"渲染成"该源没有"。读的是 result 这一层——单源与
  // 聚合两条路都把这句挂在这里。
  if(result?._date_note){h+=`<div class="meta-bar" style="border-bottom:none"><span class="source-label" style="border-color:var(--accent);color:var(--accent);white-space:normal">📅 ${esc(result._date_note)}</span></div>`;}
  // 上一句里"另列一行"的那一行：三个网页源的窗口内补筛计数由后端给
  // （tax_aggregator.aggregate_search 的 _date_filter.local_window），这里照抄，
  // 不自己数条目。got=0 的源不列，上面那行"某源 0 条"已经说过取回多少。
  if(result?._date_filter?.local_window){const lw=result._date_filter.local_window;
    const nm={so360:'360 搜索',shui5:'税屋',wechat:'微信公众号'};
    const seg=Object.keys(lw).filter(k=>lw[k].got).map(k=>`${nm[k]||k}：取回 ${lw[k].got} 条，区间内 ${lw[k].in_range} 条，区间外剔除 ${lw[k].out_of_range} 条，无日期保留 ${lw[k].no_date} 条`);
    if(seg.length)h+=`<div class="meta-bar" style="border-bottom:none"><span class="source-label" style="white-space:normal">📊 日期补筛 ${esc(seg.join('；'))}</span></div>`;}
  // 税法要件落在会计确认与计量上时，后端给整句提示（tax_analyze.accounting_note），
  // 这里照抄不自己判断：准则不在五源覆盖范围内，只能由子技能取，且不是税收依据。
  if(data.accounting_note){h+=`<div class="meta-bar" style="border-bottom:none"><span class="source-label" style="border-color:var(--g700);color:var(--g700);white-space:normal">📘 ${esc(data.accounting_note)}</span></div>`;}
  // 点名的是草案/征求意见稿时，这一栏列出的同名文件是现行有效版本、不是草案内容。
  // 整句由后端给（tax_analyze.legislative_note），这里照抄，不在前端判断库的收录范围。
  if(data.legislative_note){h+=`<div class="meta-bar" style="border-bottom:none"><span class="source-label" style="border-color:var(--accent);color:var(--accent);white-space:normal">收录范围 ${esc(data.legislative_note)}</span></div>`;}
  // 空清单的成因有四种，分流顺序按"越靠近真相越先看"：
  //   _fetch_failed —— 上游真的没取到数据（_error 是整形过的失败原因），不能读成"库里没有"
  //   _filter_note  —— 叠加收窄维度后 0 条，分不清"拼窄"还是"没有"
  //   _empty_reason —— 接口给了命中数、这一页没给清单
  //   _error(其余)  —— 法规库翻完前 N 页未筛出条目（是扫描结论，不是失败）
  // 四者都不带的空结果才读作"关键词太宽/库里确实没有这份文件"。
  if(items.length===0){
    if(result && result._fetch_failed){
      h+=`<div class="empty-state"><div style="font-size:28px;margin-bottom:8px">⚠️</div><p><b>取数失败</b></p><p style="font-size:13px;color:var(--g400)">关键词:"${esc(data.keyword)}"</p><p style="font-size:12px;margin-top:8px;color:var(--accent)">${esc(result._error||'上游没有返回数据')}</p><p style="font-size:12px;margin-top:8px;color:var(--g400)">这是没取到数据，不代表库里没有；可稍后重试</p></div>`;
    } else {
      const why=(result&&(result._filter_note||result._empty_reason||result._error))||'';
      h+=`<div class="empty-state"><div style="font-size:28px;margin-bottom:8px">🔍</div><p><b>未找到相关政策</b></p><p style="font-size:13px;color:var(--g400)">关键词:"${esc(data.keyword)}"</p>${why?`<p style="font-size:12px;margin-top:8px;color:var(--accent)">${esc(why)}</p>`:''}<p style="font-size:12px;margin-top:8px;color:var(--g400)">试试更短的关键词（如"增值税"而非"增值税优惠政策最新规定"） / 切换到"多源聚合"模式覆盖税屋与公众号</p></div>`;
    }
  }

  /* NPC 条目给数字状态码，总局法规库条目给的是录入项文本（"全文有效"）。
   两种都要认，否则文本时效会掉进"时效未标注"——那等于把明明标了有效的文件
   显示成没标，用户在界面上就看不出它能不能引用。 */
/* 来源存疑标记在卡面上写成一句完整的提醒，不再用一个小圆点代替。
   提醒的原文取自条目自带的 `_reliability_note`：同一个 medium 档在 NPC 正文检索、
   总局法规库深页说的是两件不同的事，界面自己按档位配一句固定话，就会有一句是假的。
   来源没写明原因时才退成这句中性的话，且明说"未写明存疑在哪一处"。
   标记不参与排序，也不改变这条材料出现在哪一栏。 */
function statusBadge(item){
  const t=String(item.status||'');
  let cls=item.status_code!=null?statusMap[item.status_code]:null;
  let name=item.status_code!=null?statusNames[item.status_code]:'';
  let icon=cls?statusIcons[item.status_code]:'⚪';
  if(cls==null||!cls){
    if(/废止|失效/.test(t)){cls='s-abolished';icon='🔴';}
    else if(/尚未生效|未生效/.test(t)){cls='s-pending';icon='🔵';}
    else if(/修改|修订/.test(t)){cls='s-amended';icon='🟡';}
    else if(/有效/.test(t)){cls='s-effective';icon='🟢';}
    else{cls='s-unknown';icon='⚪';}
    // NPC 那条链路的占位串是程序自己拼的"未知(None)"，不是来源给的时效；
    // 直接显示会把程序的缺省说成法规的缺省，统一换成"时效未标注"。
    name=(t&&!/^未知/.test(t))?t:'时效未标注';
  }
  return `<span class="status-badge ${cls}">${icon} ${esc(name)}</span>`;
}

items.forEach((item,i)=>{
    const st=highlightText(item.title,lastKeyword),sid=item.id||'',rawTitle=esc(item.title);
    // 弹窗四个标签页全靠 NPC 的 bbbs_id 取原文与元信息；总局、公众号、税屋的条目
    // 没有这个 ID，挂上 viewLaw 点开只会得到"获取全文失败"。这类卡片不接弹窗，
    // 直接给条目自带的原文链接，并把"弹窗取不到"这件事写在卡面上。
    const url=item.url||'';
    // esc() 走的是 textContent→innerHTML，不转义引号；URL 来自外部检索结果，
    // 要拼进 href="..." 就必须先确认它是干净的 http(s) 地址，否则属性会被截断。
    const safeUrl=/^https?:\/\/[^\s"'<>\\]+$/.test(url)?url:'';

      :`<div class="id-row">${safeUrl?`🔗 原文：<a href="${esc(safeUrl)}" target="_blank" rel="noopener">${esc((safeUrl.match(/https?:\/\/(?:www\.)?([^/]+)/)||[,'非本库链接'])[1])}</a> · 非 NPC 库条目，点开无弹窗`:'非 NPC 库条目，点开无弹窗'}</div>`;
    h+=`${openTag}
      <div class="title"><span style="font-size:11px;color:var(--g400);margin-right:6px">#${i+1}</span> ${item._source?`<span class="source-label src-${item._source}">${srcIcons[item._source]||''} ${srcLabels[item._source]||''}</span>`:''}${st}</div>
      <div class="meta"><span>${statusBadge(item)}</span>${item.document_number?`<span>文号:${esc(item.document_number)}</span>`:''}${item.effect_level?`<span>效力级别:${esc(item.effect_level)}</span>`:''}${(item.publish_date||item.date)?`<span>📅 公布:${esc(item.publish_date||item.date)}</span>`:''}${item.effective_date?`<span>施行:${esc(item.effective_date)}</span>`:''}${item.issuing_authority?`<span>🏛️ ${esc(item.issuing_authority)}</span>`:''}</div>
      ${item._reliability?`<div class="rel-note">提醒：${esc(item._reliability_note||`来源把这一条标为 ${item._reliability} 档存疑，未写明存疑在哪一处——引用前先核对这条到底有没有规定本题这件事`)}</div>`:''}
      ${idRow}</div>`;
  });
  if(total>items.length)h+=`<p style="text-align:center;font-size:12px;color:var(--g400);margin-top:12px">显示前${items.length}条，共${total}条 · 缩小搜索范围以获取更精确结果</p>`;
  c.innerHTML=h;
}

/* ═══════════ KEYWORD HIGHLIGHT ═══════════ */
function highlightText(text,kw){if(!kw||!text)return esc(text);let r=esc(text);const tokens=kw.split(/\s+/).filter(t=>t.length>=1).sort((a,b)=>b.length-a.length);tokens.forEach(t=>{const e=t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');r=r.replace(new RegExp(`(${e})`,'gi'),'<mark>$1</mark>');});return r;}

function renderLawTextTab(data,bbbsId,title){
  const d=data.detail,kw=lastKeyword;
  let body=`<div class="meta-note"><span>📅 公布:${d.publish_date||'?'}</span><span>施行:${d.effective_date||'?'}</span><span>${['','🔴已废止','🟡已修改','🟢现行有效','🔵尚未生效'][d.status_code||3]||''}</span><span>🏛️ ${d.issuing_authority||''}</span><span>📝 ${data.article_count}条法条</span>${kw?`<span>🔍 高亮:"${esc(kw)}"</span>`:''}</div>`;
  if(!data.sections||data.sections.length===0){body+='<div class="interp-empty">未能获取法规全文</div>';}
  else{data.sections.forEach(s=>{const h=highlightText(s.text,kw);if(s.type==='chapter')body+=`<div class="chapter">${h}</div>`;else if(s.type==='heading')body+=`<div class="chapter" style="font-size:13px;border:none;margin:8px 0 4px">${h}</div>`;else if(s.type==='article')body+=`<div class="article">${h}</div>`;else if(s.text.trim())body+=`<div class="body-text">${h}</div>`;});}
  document.getElementById('tabLawContent').innerHTML=`<div class="body-padded">${body}</div>`;
}

function interpFooterLabel(){
  return '检索站点：'+interpSites(_interpProvince).join(' · ')+'（仅官方来源）';
}

function onInterpProvinceChange(){
  const el=document.getElementById('interpProvince');
  _interpProvince=el?el.value:'';
  // 页脚写的就是"这次实际查了哪些站点"，换省等于换站点，页脚必须跟着换。
  if(activeTab==='interp')document.getElementById('footerInfo').textContent=interpFooterLabel();
  loadInterpretationsTab(_modalLawId);
}

function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('.modal-body .tab-panel').forEach(el=>el.classList.remove('active'));
  const panel=document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)+'Content');
  if(panel)panel.classList.add('active');
  document.querySelectorAll('.modal-tabs .tab-btn').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('tabBtn'+tab.charAt(0).toUpperCase()+tab.slice(1));
  if(btn)btn.classList.add('active');
  if(tab==='interp')loadInterpretationsTab(_modalLawId);
  if(tab==='ai')refreshAiGate();
  if(tab==='web')loadWebRelatedTab(_modalLawId,_modalTitle);
  // 措辞要说"实际直连了哪些源"：小颖言税/税海涛声/会计网/税小课/朴税只用来给
  // 命中条目打来源标签（TAX_PRACTICE_SOURCES），程序并不会去搜它们，写进这里会变成假承诺。
  // interp 的站点清单随省份变，所以走 interpFooterLabel() 现算，不写死。
  const footerLabels={law:'实时获取自NPC国家法规库',interp:interpFooterLabel(),ai:'AI 生成 · 仅供参考 · 以官方为准',web:'直连税屋(shui5.cn) + 微信公众号，另经 360 全网补充；来源标签按命中条目的域名/标题识别'};
  document.getElementById('footerInfo').textContent=footerLabels[tab]||'';
}

async function refreshAiGate(){
  // 点按钮之前就把"这次会不会花钱、能不能花"说清楚。闸门状态只能从服务端问：
  // 环境变量在 Flask 进程里，浏览器看不到，前端自己猜必然猜错。
  const note=document.getElementById('aiGateNote');
  if(!note)return;
  try{
    const h=await fetchWithRetry('/api/health',{},2,500);
    const g=h.paid_llm||{};
    note.textContent=g.enabled
      ?'已开启：将调用 TAX_LLM_CMD 指定的外部模型，费用由该账号承担'
      :(g.explanation||'外部模型调用未开启，此功能不可用');
  }catch(e){/* 问不到状态就保留默认文案，不编造开启状态 */}
}

async function generateAiInterpret(){
  const c=document.getElementById('tabAiContent');
  c.innerHTML=`<div class="interp-empty"><div class="loading-spinner"></div><p style="margin-top:10px">AI 正在解读法规…</p><p style="font-size:12px;color:var(--g400)">由本机现场生成，请稍候</p></div>`;
  try{
    const data=await fetchWithRetry(`/api/ai-interpret/${_modalLawId}?keyword=${encodeURIComponent(lastKeyword)}`);
    if(data.error)throw new Error(data.error);
    const text=data.interpretation||'';
    const sections=text.split(/^##\s+/gm).filter(Boolean);
    let h='';
    sections.forEach(sec=>{
      const lines=sec.trim().split('\n');
      const title=lines[0].trim();
      const body=lines.slice(1).join('\n').trim();
      h+=`<div style="margin-bottom:16px"><div style="font-weight:700;font-size:14px;color:var(--black);margin-bottom:4px">📌 ${esc(title)}</div><div style="font-size:14px;line-height:1.8;color:var(--g700);white-space:pre-line">${esc(body)}</div></div>`;

    c.innerHTML=h;
  }catch(e){c.innerHTML=`<div class="interp-empty">⚠️ AI 解读未生成<br><span style="font-size:12px;color:var(--g400)">${esc(e.message)}</span><br><span style="font-size:12px;color:var(--g400)">这一步调用你在 TAX_LLM_CMD 指定的外部模型，费用由该账号承担；服务端不会在未确认的情况下发起，也不会在失败后重试。</span></div>`;}
}

  else if(step==='tax_type'){const idLabels={enterprise:'企业',individual:'个人/个体户',agent:'代理记账/税务师',other:''};const idLabel=idLabels[guideState.user_type]||'';let ch=[{v:'vat',icon:'📊',label:'增值税',desc:'流转税核心'},{v:'cit',icon:'🏢',label:'企业所得税',desc:'利润征税'},{v:'iit',icon:'👤',label:'个人所得税',desc:'工资/劳务/经营'},{v:'invoice',icon:'🧾',label:'发票管理',desc:'开票/抵扣/红冲'},{v:'prefer',icon:'🎁',label:'税收优惠',desc:'减免/退税'},{v:'stamp',icon:'📝',label:'印花税',desc:'合同/账簿'},{v:'deed',icon:'🔑',label:'契税',desc:'不动产登记'},{v:'property',icon:'🏠',label:'房产税',desc:'房屋租赁'},{v:'consumption',icon:'🛒',label:'消费税',desc:'特定消费品'},{v:'tariff',icon:'🚢',label:'关税',desc:'进出口'},{v:'land_vat',icon:'🏗️',label:'土地增值税',desc:'房地产'},{v:'admin',icon:'⚖️',label:'税收征管',desc:'登记/申报/稽查'}];body.innerHTML=`<div class="step"><div class="step-label">Step 2/4 ${idLabel?'· '+idLabel:''}</div><div class="step-question">你想了解哪个税种？</div><div class="choice-grid">${ch.map(c=>`<div class="choice${guideState.tax_type===c.v?' picked':''}" onclick="guidePick('tax_type','${c.v}')"><span class="ci">${c.icon}</span>${c.label}<span class="cl">${c.desc}</span></div>`).join('')}</div></div>`;foot.innerHTML=`<button onclick="renderGuideStep('intent')">跳过手动选择 →</button>${guideState.user_type?`<button class="reset" onclick="renderGuideStep('user_type')">← 返回修改</button>`:''}`;}
  else if(step==='intent'){const tl={vat:'增值税',cit:'企业所得税',iit:'个人所得税',invoice:'发票管理',prefer:'税收优惠',stamp:'印花税',deed:'契税',property:'房产税',consumption:'消费税',tariff:'关税',land_vat:'土地增值税',admin:'税收征管'};const tLabel=tl[guideState.tax_type]||guideState.tax_type||'';body.innerHTML=`<div class="step"><div class="step-label">Step 3/4${tLabel?' · '+tLabel:''}</div><div class="step-question">你想了解什么？</div><div class="choice-grid"><div class="choice${guideState.intent==='policy'?' picked':''}" onclick="guidePick('intent','policy')"><span class="ci">📖</span>查政策 / 税率<span class="cl">具体规定、税率标准</span></div><div class="choice${guideState.intent==='preference'?' picked':''}" onclick="guidePick('intent','preference')"><span class="ci">🎁</span>优惠资格<span class="cl">能否享受减免/退税</span></div><div class="choice${guideState.intent==='risk'?' picked':''}" onclick="guidePick('intent','risk')"><span class="ci">⚠️</span>风险自查<span class="cl">金税四期/合规</span></div><div class="choice${guideState.intent==='filing'?' picked':''}" onclick="guidePick('intent','filing')"><span class="ci">📋</span>申报流程<span class="cl">怎么申报/截止日期</span></div><div class="choice${guideState.intent==='invoice'?' picked':''}" onclick="guidePick('intent','invoice')"><span class="ci">🧾</span>发票问题<span class="cl">开票/遗失/红冲</span></div><div class="choice${guideState.intent==='calc'?' picked':''}" onclick="guidePick('intent','calc')"><span class="ci">🔢</span>计算/标准<span class="cl">起征点/扣除标准</span></div></div></div>`;foot.innerHTML=`<button onclick="renderGuideStep('conditions')">跳过手动选择 →</button><button class="reset" onclick="renderGuideStep('tax_type')">← 返回修改</button>`;}
  else{const tl={vat:'增值税',cit:'企业所得税',iit:'个人所得税',invoice:'发票管理',prefer:'税收优惠'};const il={policy:'查政策',preference:'优惠资格',risk:'风险自查',filing:'申报流程',invoice:'发票问题',calc:'计算标准'};const tLabel=tl[guideState.tax_type]||guideState.tax_type||'';const iLabel=il[guideState.intent]||guideState.intent||'';body.innerHTML=`<div class="step"><div class="step-label">Step 4/4${tLabel?' · '+tLabel:''}${iLabel?' · '+iLabel:''}</div><div class="step-question">补充条件（可选，可多选）</div><div class="choice-grid"><div class="choice${guideState.enterprise_type==='small'?' picked':''}" onclick="guidePick('enterprise_type','small')"><span class="ci">🏪</span>小规模纳税人<span class="cl">年应税≤500万</span></div><div class="choice${guideState.enterprise_type==='general'?' picked':''}" onclick="guidePick('enterprise_type','general')"><span class="ci">🏭</span>一般纳税人</div><div class="choice${guideState.enterprise_type==='micro'?' picked':''}" onclick="guidePick('enterprise_type','micro')"><span class="ci">🌱</span>小微企业<span class="cl">利润≤300万</span></div><div class="choice${guideState.enterprise_type==='hitech'?' picked':''}" onclick="guidePick('enterprise_type','hitech')"><span class="ci">🔬</span>高新技术企业</div><div class="choice${guideState.timeframe==='latest'?' picked':''}" onclick="guidePick('timeframe','latest')"><span class="ci">🆕</span>只看最新政策</div><div class="choice${guideState.timeframe==='2024'?' picked':''}" onclick="guidePick('timeframe','2024')"><span class="ci">📅</span>2024年以来的</div><div class="choice${guideState.scope==='national'?' picked':''}" onclick="guidePick('scope','national')"><span class="ci">✅</span>只看现行有效<span class="cl">默认</span></div><div class="choice${guideState.scope==='all_status'?' picked':''}" onclick="guidePick('scope','all_status')"><span class="ci">🗂</span>含已修改·已废止</div></div><div style="margin-top:14px"><div style="font-size:12px;color:var(--g500);margin-bottom:4px">或直接输入关键词：</div><input type="text" id="customKeyword" style="width:100%;padding:8px 12px;border:1px solid var(--g200);font-size:13px;background:var(--white);color:var(--black)" placeholder="例如：研发费用加计扣除、留抵退税…"></div></div>`;foot.innerHTML=`<button onclick="executeGuidedSearch()">🔍 生成搜索 →</button><button class="reset" onclick="renderGuideStep('intent')">← 返回修改</button>`;}
}

function executeGuidedSearch(){const taxMap={vat:'增值税',cit:'企业所得税',iit:'个人所得税',invoice:'发票管理办法',prefer:'税收优惠',stamp:'印花税',deed:'契税',property:'房产税',consumption:'消费税',tariff:'关税',land_vat:'土地增值税',admin:'税收征收管理法'};const intentMap={policy:'',preference:'优惠',risk:'风险 合规',filing:'申报',invoice:'发票',calc:'标准 扣除'};const entMap={small:'小规模纳税人',general:'一般纳税人',micro:'小微企业',hitech:'高新技术企业'};let parts=[];const taxK=guideState.tax_type?taxMap[guideState.tax_type]||guideState.tax_type:'';if(taxK)parts.push(taxK);if(guideState.intent&&intentMap[guideState.intent])parts.push(intentMap[guideState.intent]);if(guideState.enterprise_type&&entMap[guideState.enterprise_type])parts.push(entMap[guideState.enterprise_type]);const custom=document.getElementById('customKeyword')?.value?.trim();if(custom)parts.push(custom);document.getElementById('searchInput').value=parts.join(' ')||'增值税';if(guideState.timeframe==='latest')document.getElementById('filterSort').value='date';if(guideState.timeframe==='2024')document.getElementById('filterDateFrom').value='2024-01-01';setNpcStatus(guideState.scope==='national'?'3':'');toggleGuidance();doSearch();}

function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
</script>
